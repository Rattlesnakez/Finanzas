<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis finanzas</title>
<meta name="theme-color" content="#1b2433">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#1b2433;--mute:#667085;--line:#dde2ea;--in:#1f8a5b;--out:#c4432f;--box:#2a5fd0;--acc:#1b2433;--accfg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#10151f;--card:#1a2130;--ink:#e8ecf4;--mute:#97a1b3;--line:#2b3446;--in:#4cc38a;--out:#ff7a66;--box:#7aa2ff;--acc:#e8ecf4;--accfg:#10151f}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;line-height:1.35}
main{max-width:640px;margin:0 auto;padding:10px 14px calc(150px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:var(--ink);-webkit-tap-highlight-color:transparent;touch-action:manipulation;cursor:pointer}
input{font:inherit;color:var(--ink);width:100%;font-size:16px;min-height:46px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
:focus-visible{outline:2px solid var(--box);outline-offset:1px}
small,.hint{color:var(--mute)}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.head h1{font-size:1.25rem;font-weight:800;margin:0}
.hr{display:flex;align-items:center;gap:8px}.hr .hint{font-size:.85rem}
.gear{min-width:44px;min-height:44px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:1.2rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.tot b.big{display:block;font-size:2rem;font-weight:800;line-height:1.1}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.three small{display:block;font-size:.8rem}.three b{font-size:1rem}
.three .y{font-size:.75rem;color:var(--mute);display:block}
.nav{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.nav button{min-width:46px;min-height:46px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:1.1rem}
.nav .t{flex:1;text-align:center;font-weight:600;text-transform:capitalize}
.nav .hoy{padding:0 12px;font-size:.9rem}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum small{display:block;font-size:.8rem}.sum b{font-weight:800}
.in{color:var(--in)}.out{color:var(--out)}.box{color:var(--box)}
.note{font-size:.85rem;color:var(--mute);margin-top:10px}
.day{font-size:.85rem;color:var(--mute);margin:14px 0 2px;font-weight:600;text-transform:capitalize}
.it{display:flex;align-items:center;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.it .t{flex:1;min-width:0}.it .t div{overflow-wrap:anywhere}.it .t small{font-size:.8rem}
.it .a{font-weight:600;white-space:nowrap}
.x{border:0;background:none;color:var(--mute);font-size:1.4rem;min-width:44px;min-height:44px}
.mini{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px;font-size:.85rem}
.empty{color:var(--mute);padding:16px 0;text-align:center}
.seg{display:flex;gap:6px;margin:8px 0}
.seg button{flex:1;min-height:44px;padding:6px 4px;border:1px solid var(--line);background:var(--bg);border-radius:10px;font-size:.92rem}
.seg button.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.btn{width:100%;min-height:50px;border:0;border-radius:12px;background:var(--acc);color:var(--accfg);font-weight:700;font-size:1rem}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:4px;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.bar button{flex:1;min-height:48px;border:0;background:none;border-radius:10px;color:var(--mute);font-weight:600}
.bar button.on{color:var(--ink);background:var(--bg)}
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:6;width:62px;height:62px;border:0;border-radius:50%;background:var(--acc);color:var(--accfg);font-size:2rem;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.sheet{position:fixed;inset:0;z-index:10;display:none;background:rgba(0,0,0,.45);align-items:flex-end}
.sheet.open{display:flex}
.sheet>div{background:var(--card);width:100%;max-width:640px;margin:0 auto;border-radius:20px 20px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom,0px));max-height:94vh;overflow:auto}
.sh{display:flex;justify-content:space-between;align-items:center}
.sh b{font-size:1.05rem}
.amt{font-size:2.2rem;font-weight:800;text-align:center;min-height:64px;margin:8px 0}
.lab{font-size:.82rem;color:var(--mute);margin:10px 0 2px;display:block}
.chips{display:flex;gap:6px;overflow-x:auto;margin:8px 0 0;padding-bottom:2px}
.chips button{flex:none;min-height:38px;padding:0 12px;border:1px solid var(--line);background:var(--bg);border-radius:19px;font-size:.88rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.sp{margin-top:14px}
.hide{display:none}
</style>
</head>
<body>
<main>
<div class="head"><h1>Mis finanzas</h1><div class="hr"><span id="hdate" class="hint"></span><button class="gear" id="gear" aria-label="Ajustes">⚙</button></div></div>

<div class="card hide" id="set">
  <b>Cajita</b>
  <label class="lab" for="rate">Rendimiento anual (%)</label>
  <input id="rate" type="number" inputmode="decimal" step="0.1" min="0">
  <div class="sp"><b>Respaldo</b></div>
  <p class="hint" style="margin:4px 0 10px">Tus datos viven solo en este iPhone. Exporta una copia de vez en cuando y guárdala en Archivos o iCloud.</p>
  <div class="two"><button class="btn" id="exp">Exportar</button><button class="btn" id="imp">Importar</button></div>
  <input type="file" id="file" accept="application/json,.json" class="hide">
  <button class="mini sp" id="wipe">Borrar todos los datos</button>
</div>

<div class="card tot" id="bal"></div>

<div id="period">
  <div class="nav"><button data-nav="-1" aria-label="Anterior">‹</button><span class="t" id="plabel"></span><button data-nav="1" aria-label="Siguiente">›</button><button class="hoy" data-nav="0">Hoy</button></div>
  <div class="card"><div class="sum" id="sum"></div><div class="note" id="split"></div><div id="list"></div></div>
</div>

<div id="plan" class="hide">
  <div class="nav"><button data-pnav="-1" aria-label="Día anterior">‹</button><span class="t" id="pl"></span><button data-pnav="1" aria-label="Día siguiente">›</button><button class="hoy" data-pnav="0">Hoy</button></div>
  <div class="card">
    <b>Gasto esperado</b>
    <div class="two sp" style="margin-top:8px"><input id="pwhy" type="text" placeholder="Motivo"><input id="pamt" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Monto"></div>
    <div class="seg" id="pseg"><button data-m="cash" class="on">Efectivo</button><button data-m="card">Tarjeta</button></div>
    <button class="btn" id="padd">Agregar al plan</button>
  </div>
  <div class="card"><div class="sum" id="psum"></div><div class="note" id="psplit"></div><div id="plist"></div></div>
</div>
</main>

<button class="fab" id="fab" aria-label="Agregar movimiento">+</button>

<div class="bar" id="bar">
  <button data-v="day" class="on">Día</button>
  <button data-v="week">Semana</button>
  <button data-v="month">Mes</button>
  <button data-v="plan">Planear</button>
</div>

<div class="sheet" id="sheet"><div>
  <div class="sh"><b>Nuevo movimiento</b><button class="x" id="close" aria-label="Cerrar">×</button></div>
  <div class="seg" id="types">
    <button data-type="out" class="on">Gasto</button>
    <button data-type="in">Ingreso</button>
    <button data-type="save">A cajita</button>
    <button data-type="draw">De cajita</button>
  </div>
  <input class="amt" id="amt" type="number" inputmode="decimal" min="0" step="0.01" placeholder="$0.00" aria-label="Monto">
  <label class="lab" for="why">Motivo</label>
  <input id="why" type="text" placeholder="Ej. comida, propinas, renta">
  <div class="chips" id="chips"></div>
  <label class="lab" id="mlabel">Pagado con</label>
  <div class="seg" id="mseg"><button data-m="cash" class="on">Efectivo</button><button data-m="card">Tarjeta</button></div>
  <label class="lab" for="d">Fecha</label>
  <input id="d" type="date">
  <button class="btn sp" id="add">Guardar gasto</button>
</div></div>

<script>
(function(){
var KEY="finanzas_v1",S={tx:[],plans:[],rate:13},type="out",view="day",meth="cash",pmeth="cash";
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.tx)S=p}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)};
var fmt=new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN"});
function iso(dt){return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0")}
function parse(s){var a=s.split("-");return new Date(+a[0],+a[1]-1,+a[2])}
function addDays(s,n){var x=parse(s);x.setDate(x.getDate()+n);return iso(x)}
var today=iso(new Date()),anchor=today,pday=today;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
var NAMES={in:"Ingreso",out:"Gasto",save:"A cajita",draw:"De cajita"};
var MN={cash:"Efectivo",card:"Tarjeta"};
function dlabel(s){return parse(s).toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"short"})}
function seg(el,v){[].forEach.call(el.children,function(b){b.classList.toggle("on",b.dataset.m===v)})}

function boxValue(){
  var ev=S.tx.filter(function(t){return t.type==="save"||t.type==="draw"}).sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0});
  var v=0,pr=0,last=null,g=Math.pow(1+S.rate/100,1/365);
  ev.forEach(function(e){
    if(last&&e.d>last){v*=Math.pow(g,(parse(e.d)-parse(last))/864e5)}
    if(!last||e.d>last)last=e.d;
    var s=e.type==="save"?1:-1;v+=s*e.amt;pr+=s*e.amt;
  });
  if(last&&today>last)v*=Math.pow(g,(parse(today)-parse(last))/864e5);
  return{v:v,pr:pr};
}
function acct(m){
  return S.tx.filter(function(t){return t.m===m}).reduce(function(a,t){
    return a+(t.type==="in"||t.type==="draw"?t.amt:-t.amt)},0);
}
function renderBal(){
  var c=acct("cash"),k=acct("card"),b=boxValue(),y=b.v-b.pr;
  $("bal").innerHTML='<small>Total</small><b class="big">'+fmt.format(c+k+b.v)+'</b><div class="three">'+
   '<div><small>Efectivo</small><b>'+fmt.format(c)+'</b></div>'+
   '<div><small>Tarjeta</small><b>'+fmt.format(k)+'</b></div>'+
   '<div><small>Cajita</small><b class="box">'+fmt.format(b.v)+'</b><span class="y">+'+fmt.format(y)+' ganado</span></div></div>';
}
function range(){
  var a=parse(anchor);
  if(view==="day")return[anchor,anchor,anchor===today?"Hoy":dlabel(anchor)];
  if(view==="week"){var o=(a.getDay()+6)%7,s=addDays(anchor,-o),e=addDays(s,6),f={day:"numeric",month:"short"};
    return[s,e,parse(s).toLocaleDateString("es-MX",f)+" – "+parse(e).toLocaleDateString("es-MX",f)]}
  var s2=iso(new Date(a.getFullYear(),a.getMonth(),1)),e2=iso(new Date(a.getFullYear(),a.getMonth()+1,0));
  return[s2,e2,a.toLocaleDateString("es-MX",{month:"long",year:"numeric"})];
}
function txRow(t){
  var sign=t.type==="in"||t.type==="draw"?"+":"−",cls=t.type==="in"?"in":t.type==="out"?"out":"box";
  var sub=t.type==="save"?"Sale de "+MN[t.m].toLowerCase():t.type==="draw"?"Entra a "+MN[t.m].toLowerCase():NAMES[t.type]+" · "+MN[t.m];
  return '<div class="it"><div class="t"><div>'+esc(t.why||NAMES[t.type])+'</div><small>'+sub+'</small></div><div class="a '+cls+'">'+sign+fmt.format(t.amt)+'</div><button class="x" data-del="'+t.id+'" aria-label="Borrar">×</button></div>';
}
function renderPeriod(){
  var r=range();$("plabel").textContent=r[2];
  var L=S.tx.filter(function(t){return t.d>=r[0]&&t.d<=r[1]}).sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:0});
  var inc=0,out=0,oc=0,ok=0;
  L.forEach(function(t){if(t.type==="in")inc+=t.amt;if(t.type==="out"){out+=t.amt;if(t.m==="cash")oc+=t.amt;else ok+=t.amt}});
  $("sum").innerHTML='<div><small>Ingresos</small><b class="in">'+fmt.format(inc)+'</b></div><div><small>Gastos</small><b class="out">'+fmt.format(out)+'</b></div><div><small>Neto</small><b>'+fmt.format(inc-out)+'</b></div>';
  $("split").textContent=out>0?"Gastado: "+fmt.format(oc)+" en efectivo, "+fmt.format(ok)+" con tarjeta":"";
  var h='';
  if(!L.length)h='<div class="empty">Sin movimientos aquí. Toca + para registrar el primero.</div>';
  else{var cur="";L.forEach(function(t){if(view!=="day"&&t.d!==cur){cur=t.d;h+='<div class="day">'+dlabel(t.d)+'</div>'}h+=txRow(t)})}
  $("list").innerHTML=h;
}
function renderPlan(){
  var d=pday,P=S.plans.filter(function(p){return p.d===d}),tot=0,pc=0,pk=0;
  $("pl").textContent=d===today?"Hoy":d===addDays(today,1)?"Mañana":dlabel(d);
  P.forEach(function(p){tot+=p.amt;if(p.m==="cash")pc+=p.amt;else pk+=p.amt});
  var real=S.tx.filter(function(t){return t.d===d&&t.type==="out"}).reduce(function(a,t){return a+t.amt},0);
  var c=acct("cash"),k=acct("card");
  $("psum").innerHTML='<div><small>Plan</small><b class="out">'+fmt.format(tot)+'</b></div><div><small>Ya gastado</small><b>'+fmt.format(real)+'</b></div><div><small>Te quedaría</small><b>'+fmt.format(c+k-pc-pk)+'</b></div>';
  $("psplit").textContent="Efectivo: "+fmt.format(pc)+" de "+fmt.format(c)+" · Tarjeta: "+fmt.format(pk)+" de "+fmt.format(k);
  var h='';
  if(!P.length)h='<div class="empty">Aún no planeas gastos para este día.</div>';
  P.forEach(function(p){h+='<div class="it"><div class="t"><div>'+esc(p.why)+'</div><small>'+MN[p.m]+'</small></div><div class="a out">'+fmt.format(p.amt)+'</div><button class="mini" data-spent="'+p.id+'">Ya lo gasté</button><button class="x" data-pdel="'+p.id+'" aria-label="Quitar">×</button></div>'});
  $("plist").innerHTML=h;
}
function render(){renderBal();renderPeriod();renderPlan()}

function chips(){
  var seen={},out=[];
  for(var i=S.tx.length-1;i>=0&&out.length<8;i--){var t=S.tx[i];
    if(t.type===type&&t.why&&!seen[t.why]){seen[t.why]=1;out.push(t.why)}}
  $("chips").innerHTML=out.map(function(w){return '<button data-chip="'+esc(w)+'">'+esc(w)+'</button>'}).join("");
}
function setType(t){
  type=t;
  [].forEach.call($("types").children,function(x){x.classList.toggle("on",x.dataset.type===t)});
  $("add").textContent="Guardar "+(t==="out"?"gasto":t==="in"?"ingreso":t==="save"?"depósito":"retiro");
  $("mlabel").textContent=t==="out"?"Pagado con":t==="in"?"Recibido en":t==="save"?"Sale de":"Entra a";
  chips();
}
function openSheet(){$("d").value=today;setType(type);$("sheet").classList.add("open");setTimeout(function(){$("amt").focus()},60)}
function closeSheet(){$("sheet").classList.remove("open")}

$("fab").onclick=openSheet;$("close").onclick=closeSheet;
$("sheet").onclick=function(e){if(e.target===this)closeSheet()};
$("types").onclick=function(e){var b=e.target.closest("button");if(b)setType(b.dataset.type)};
$("mseg").onclick=function(e){var b=e.target.closest("button");if(b){meth=b.dataset.m;seg(this,meth)}};
$("pseg").onclick=function(e){var b=e.target.closest("button");if(b){pmeth=b.dataset.m;seg(this,pmeth)}};
$("chips").onclick=function(e){var b=e.target.closest("[data-chip]");if(b){$("why").value=b.dataset.chip;$("amt").focus()}};
$("add").onclick=function(){
  var a=parseFloat($("amt").value);
  if(!(a>0)){$("amt").focus();return}
  var d=$("d").value||today;
  S.tx.push({id:uid(),type:type,amt:Math.round(a*100)/100,why:$("why").value.trim(),m:meth,d:d});
  $("amt").value="";$("why").value="";save();anchor=d;closeSheet();render();
};
$("bar").onclick=function(e){var b=e.target.closest("button");if(!b)return;view=b.dataset.v;
  [].forEach.call(this.children,function(x){x.classList.toggle("on",x===b)});
  $("period").classList.toggle("hide",view==="plan");$("plan").classList.toggle("hide",view!=="plan");
  $("fab").classList.toggle("hide",view==="plan");
  window.scrollTo(0,0);render()};
$("period").onclick=function(e){
  var n=e.target.closest("[data-nav]");
  if(n){var k=+n.dataset.nav;
    if(k===0)anchor=today;
    else if(view==="day")anchor=addDays(anchor,k);
    else if(view==="week")anchor=addDays(anchor,7*k);
    else{var a=parse(anchor);anchor=iso(new Date(a.getFullYear(),a.getMonth()+k,1))}
    renderPeriod();return}
  var x=e.target.closest("[data-del]");
  if(x&&confirm("¿Borrar este movimiento?")){S.tx=S.tx.filter(function(t){return t.id!==x.dataset.del});save();render()}
};
$("padd").onclick=function(){
  var a=parseFloat($("pamt").value),w=$("pwhy").value.trim();
  if(!(a>0)){$("pamt").focus();return}
  S.plans.push({id:uid(),d:pday,why:w||"Gasto planeado",amt:Math.round(a*100)/100,m:pmeth});
  $("pamt").value="";$("pwhy").value="";save();renderPlan();
};
$("plan").onclick=function(e){
  var n=e.target.closest("[data-pnav]");
  if(n){var k=+n.dataset.pnav;pday=k===0?today:addDays(pday,k);renderPlan();return}
  var s=e.target.closest("[data-spent]"),x=e.target.closest("[data-pdel]");
  if(s){var p=S.plans.filter(function(q){return q.id===s.dataset.spent})[0];
    if(p){S.tx.push({id:uid(),type:"out",amt:p.amt,why:p.why,m:p.m,d:p.d});S.plans=S.plans.filter(function(q){return q!==p});save();render()}}
  if(x){S.plans=S.plans.filter(function(q){return q.id!==x.dataset.pdel});save();renderPlan()}
};

$("rate").value=S.rate;
$("rate").onchange=function(){var r=parseFloat(this.value);if(isFinite(r)&&r>=0){S.rate=r;save();render()}else this.value=S.rate};
$("hdate").textContent=dlabel(today);
$("gear").onclick=function(){$("set").classList.toggle("hide")};
$("exp").onclick=function(){
  var blob=new Blob([JSON.stringify(S)],{type:"application/json"}),name="finanzas-"+today+".json";
  try{var f=new File([blob],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(function(){});return}}catch(e){}
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
};
$("imp").onclick=function(){$("file").click()};
$("file").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var p=JSON.parse(r.result);if(!p||!Array.isArray(p.tx))throw 0;
    if(confirm("Esto reemplaza los datos actuales. ¿Continuar?")){S={tx:p.tx,plans:p.plans||[],rate:+p.rate>=0?+p.rate:13};save();$("rate").value=S.rate;render()}}
    catch(e){alert("El archivo no es una copia válida.")}};
  r.readAsText(f);this.value=""};
$("wipe").onclick=function(){if(confirm("¿Borrar todos tus datos? No se puede deshacer.")){S={tx:[],plans:[],rate:13};save();$("rate").value=13;render()}};
document.addEventListener("visibilitychange",function(){
  var t=iso(new Date());if(t===today)return;
  if(anchor===today)anchor=t;if(pday===today)pday=t;
